name: Version bump check

on:
  pull_request:
    branches: [main]

jobs:
  check-version-bump:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check if version bump is required
      shell: sh
      run: |
        # List of files changed by this PR relative to main.
        changed_files=$(git diff --name-only origin/main...HEAD)

        # Docs-only iff every changed file is .github/*, docs/*, or a
        # top-level *.md (no slash in the path, ends in .md).
        docs_only=true
        for file in $changed_files; do
          case "$file" in
            .github/*|docs/*) ;;
            *)
              if echo "$file" | grep -qE '^[^/]+\.md$'; then
                continue
              fi
              docs_only=false
              break
              ;;
          esac
        done

        if [ "$docs_only" = "true" ]; then
          echo "Docs-only change, skipping version bump check."
          exit 0
        fi

        manifest=plugins/ongo/.claude-plugin/plugin.json
        marketplace=.claude-plugin/marketplace.json
        main_version=$(git show origin/main:$manifest 2>/dev/null \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
        pr_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest")
        marketplace_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["plugins"][0]["version"])' "$marketplace")

        echo "main version: '$main_version'"
        echo "PR version:   '$pr_version'"

        if [ -z "$pr_version" ]; then
          echo "::error::No version found in $manifest."
          exit 1
        fi

        if [ "$main_version" = "$pr_version" ]; then
          echo "::error::Version in $manifest was not bumped."
          exit 1
        fi

        if [ "$pr_version" != "$marketplace_version" ]; then
          echo "::error::Plugin manifest and marketplace versions differ."
          exit 1
        fi

        echo "Version bumped from '$main_version' to '$pr_version'."
